name: Aggiornamento Automatico EPG

on:
  schedule:
    # Esegue ogni notte alle 02:00 UTC (03:00 ora italiana)
    - cron: '0 2 * * *'
  workflow_dispatch: # Permette di avviarlo manualmente da GitHub

jobs:
  generate-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa librerie Python
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui lo script EPG
        run: python generate_epg.py

      - name: Commit e Push dei file generati
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add epg.xml epg.xml.gz
          git commit -m "Automated EPG Update [skip ci]" || exit 0
          git push
